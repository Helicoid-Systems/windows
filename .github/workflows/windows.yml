# Windows build and tests for Helicoid Manager / Helicoid Computer.
# WinUI apps require windows-latest. Domain tests also run on this job.
# Unsigned development output is uploaded for a Windows 11 x64 tester.
#
# Helicoid.ConsoleProbe is a separate small diagnostic console tool
# (D26/RD03/V40 prerequisite). It is never folded into the WinUI bundle.
#
# Worker/supervisor proof: this job builds and runs the Windows-native
# integration suite (real named pipes, Job Objects, kernel PID/session/SID
# identity, per-launch capability, fencing). Native Windows execution is
# proved here — not on the macOS coordinator host.
#
# Development bundle flags (CI-verified after the ProcessorArchitecture-neutral
# MSIX failure): -r win-x64 -p:Platform=x64 -p:WindowsPackageType=None.
# Those defaults are also baked into the WinUI csproj files.

name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows 11 x64 build and tests
    runs-on: windows-latest
    # Hard job bound so a hung native test cannot stall the run indefinitely.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked mode)
        run: dotnet restore src/Helicoid.Domain.Tests/Helicoid.Domain.Tests.csproj --locked-mode

      - name: Domain tests
        timeout-minutes: 10
        run: dotnet test src/Helicoid.Domain.Tests/Helicoid.Domain.Tests.csproj -c Release --nologo --no-restore

      - name: Build Helicoid Manager
        run: dotnet build src/Helicoid.Manager/Helicoid.Manager.csproj -c Release -r win-x64 -p:Platform=x64 -p:WindowsPackageType=None --nologo

      - name: Build Helicoid Computer
        run: dotnet build src/Helicoid.Computer/Helicoid.Computer.csproj -c Release -r win-x64 -p:Platform=x64 -p:WindowsPackageType=None --nologo

      - name: Publish unsigned development output
        shell: pwsh
        run: |
          dotnet publish src/Helicoid.Manager/Helicoid.Manager.csproj -c Release -r win-x64 -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true --self-contained true -o artifacts/manager
          dotnet publish src/Helicoid.Computer/Helicoid.Computer.csproj -c Release -r win-x64 -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true --self-contained true -o artifacts/computer

      - name: Verify supplied Windows icon resources
        shell: pwsh
        run: python scripts/verify-windows-icons.py --manager-publish artifacts/manager --computer-publish artifacts/computer

      - name: Stage development launcher beside Manager
        shell: pwsh
        run: |
          Copy-Item "scripts/start-development-manager.cmd" "artifacts/manager/start-development-manager.cmd" -ErrorAction Stop
          Copy-Item "scripts/BUNDLE-TESTING.md" "artifacts/manager/BUNDLE-TESTING.md" -ErrorAction Stop

      - name: Launcher argument-forwarding tests (native Windows, no GUI)
        shell: pwsh
        run: powershell -File scripts/test-start-development-manager.ps1

      - name: Upload unsigned development output
        uses: actions/upload-artifact@v4
        with:
          name: helicoid-windows-unsigned-dev
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      # --- Capture worker bundle (reproducible; no server credentials or input) ---

      - name: Publish CaptureWorker bundle
        shell: pwsh
        run: |
          dotnet publish src/Helicoid.CaptureWorker/Helicoid.CaptureWorker.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:ContinuousIntegrationBuild=true -p:Deterministic=true `
            --nologo -o artifacts/capture-worker

          # The per-user worker has one capture operation behind authenticated,
          # fenced IPC. It receives no grant token, server credential, or input API.
          $worker = "artifacts/capture-worker/Helicoid.CaptureWorker.exe"
          if (-not (Test-Path $worker)) { throw "CaptureWorker exe missing" }
          $depsPath = "artifacts/capture-worker/Helicoid.CaptureWorker.deps.json"
          if (-not (Test-Path $depsPath)) { throw "CaptureWorker dependency manifest missing" }
          $deps = Get-Content $depsPath -Raw | ConvertFrom-Json
          $libraries = @($deps.libraries.PSObject.Properties.Name)
          if (-not ($libraries | Where-Object { $_ -like "Helicoid.WorkerTransport/*" })) {
            throw "CaptureWorker does not contain the isolated worker transport assembly"
          }
          if ($libraries | Where-Object { $_ -like "Helicoid.WindowsPlatform/*" }) {
            throw "CaptureWorker must not carry the endpoint HTTP/WebRTC platform assembly"
          }
          Write-Host "CaptureWorker dependency boundary verified: isolated transport, no endpoint platform assembly"

          # Reproducibility manifest: sorted SHA-256 of every published file.
          $files = Get-ChildItem "artifacts/capture-worker" -Recurse -File | Sort-Object FullName
          $lines = foreach ($f in $files) {
            $rel = $f.FullName.Substring((Resolve-Path "artifacts/capture-worker").Path.Length + 1)
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $rel"
          }
          $lines | Set-Content -Path "artifacts/capture-worker/SHA256SUMS" -Encoding ascii
          Write-Host "CaptureWorker bundle manifest:"
          Get-Content "artifacts/capture-worker/SHA256SUMS"

      - name: Upload CaptureWorker bundle
        uses: actions/upload-artifact@v4
        with:
          name: helicoid-windows-capture-worker
          path: artifacts/capture-worker/
          if-no-files-found: error
          retention-days: 14

      # --- Worker IPC admission check (real child process, fail-closed) ---

      - name: Worker IPC admission checks (native Windows)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $workerExe = "artifacts/capture-worker/Helicoid.CaptureWorker.exe"
          if (-not (Test-Path $workerExe)) { throw "worker exe missing" }

          # 1. No env vars -> config error (exit 1). Mandatory fields deny.
          $p = Start-Process -FilePath $workerExe -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput "$env:RUNNER_TEMP\w1.out" -RedirectStandardError "$env:RUNNER_TEMP\w1.err"
          if ($p.ExitCode -ne 1) { throw "no-env expected exit 1, got $($p.ExitCode)" }
          Write-Host "PASS: missing env vars denied (exit 1)"

          # 2. Missing fencing IDs -> config error (exit 1). Fencing is mandatory.
          $env:HELI_WORKER_CAP = "00" * 32
          $env:HELI_WORKER_PIPE = "helicoid-worker-ci"
          $env:HELI_WORKER_GEN = "1"
          Remove-Item Env:HELI_WORKER_BOOT -ErrorAction SilentlyContinue
          Remove-Item Env:HELI_WORKER_LAUNCH -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $workerExe -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput "$env:RUNNER_TEMP\w2.out" -RedirectStandardError "$env:RUNNER_TEMP\w2.err"
          if ($p.ExitCode -ne 1) { throw "missing-fence expected exit 1, got $($p.ExitCode)" }
          Write-Host "PASS: missing fencing IDs denied (exit 1)"

          # 3. Malformed fencing IDs -> config error (exit 1).
          $env:HELI_WORKER_BOOT = "AABB"
          $env:HELI_WORKER_LAUNCH = "CCDD"
          $p = Start-Process -FilePath $workerExe -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput "$env:RUNNER_TEMP\w3.out" -RedirectStandardError "$env:RUNNER_TEMP\w3.err"
          if ($p.ExitCode -ne 1) { throw "malformed-fence expected exit 1, got $($p.ExitCode)" }
          Write-Host "PASS: malformed fencing IDs denied (exit 1)"

          Remove-Item Env:HELI_WORKER_CAP -ErrorAction SilentlyContinue
          Remove-Item Env:HELI_WORKER_PIPE -ErrorAction SilentlyContinue
          Remove-Item Env:HELI_WORKER_GEN -ErrorAction SilentlyContinue
          Remove-Item Env:HELI_WORKER_BOOT -ErrorAction SilentlyContinue
          Remove-Item Env:HELI_WORKER_LAUNCH -ErrorAction SilentlyContinue

      # --- ConsoleProbe: independent build, publish, shape check, artifact ---

      - name: Verify numeric WTS decoder layout against Windows SDK
        shell: pwsh
        run: ./scripts/test-wts-layout.ps1

      - name: Build Helicoid.ConsoleProbe
        run: dotnet build src/Helicoid.ConsoleProbe/Helicoid.ConsoleProbe.csproj -c Release --nologo

      - name: Publish Helicoid.ConsoleProbe (self-contained win-x64)
        run: dotnet publish src/Helicoid.ConsoleProbe/Helicoid.ConsoleProbe.csproj -c Release -r win-x64 --self-contained true --nologo -o artifacts/console-probe

      - name: Native query check (proves UOI reader on real Windows)
        shell: pwsh
        run: |
          $out = & "artifacts/console-probe/Helicoid.ConsoleProbe.exe" --native-query-check | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            Write-Error "native-query-check exited with $code (expected 0 when UOI reader works)"
            exit 1
          }
          $report = $out | ConvertFrom-Json
          if ($report.nativeQueryCheck -ne $true) {
            Write-Error "nativeQueryCheck must be true on Windows CI (got $($report.nativeQueryCheck))"
            exit 1
          }
          # Sanitized bool only: desktop name/path/user must never appear.
          if ($out -match 'Default|Winlogon|Secure|ScreenSaver|Desktop\\\\') {
            Write-Error "native-query-check output leaked desktop name/path"
            exit 1
          }
          Write-Host "native-query-check OK"

      - name: Run ConsoleProbe and assert result shape
        timeout-minutes: 5
        shell: pwsh
        run: |
          $out = & "artifacts/console-probe/Helicoid.ConsoleProbe.exe" | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ConsoleProbe exited with $LASTEXITCODE (expected 0 for any completed diagnostic)"
            exit 1
          }
          Write-Host $out
          $report = $out | ConvertFrom-Json

          foreach ($field in 'tool','disclaimer','eligible','reason','facts') {
            if ($null -eq $report.PSObject.Properties[$field]) {
              Write-Error "Missing required field: $field"
              exit 1
            }
          }
          if ($report.tool -ne 'Helicoid.ConsoleProbe') {
            Write-Error "Unexpected tool name: $($report.tool)"
            exit 1
          }
          foreach ($phrase in 'Diagnostic metadata only','Not admitted','Not capture-authorized','not enrolled','No desktop generation is manufactured','No remote access is enabled','working candidate diagnostic') {
            if ($report.disclaimer -notlike "*$phrase*") {
              Write-Error "Disclaimer missing required phrase: $phrase"
              exit 1
            }
          }
          if ($report.eligible -isnot [bool]) {
            Write-Error "eligible must be boolean"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace([string]$report.reason)) {
            Write-Error "reason must be non-empty"
            exit 1
          }
          foreach ($fact in 'physicalConsoleSessionId','processSessionId','connectState','protocolType','desktopCategory','observationStable','wtsQuerySucceeded','desktopQuerySucceeded','lockState','lockQuerySucceeded') {
            if ($null -eq $report.facts.PSObject.Properties[$fact]) {
              Write-Error "Missing facts field: $fact"
              exit 1
            }
          }
          if ($report.schemaVersion -ne 2 -or $report.facts.lockQuerySucceeded -isnot [bool]) {
            throw 'Expected repaired probe schema and boolean lockQuerySucceeded'
          }
          if ($report.facts.lockState -notin @('Unknown','Locked','Unlocked')) {
            throw 'Unexpected session lock classification'
          }
          # On an observable console, prove the actual extended WTS query works.
          # This is query correctness; it does not establish the lock matrix.
          if ($report.facts.wtsQuerySucceeded -and
              $report.facts.physicalConsoleSessionId -gt 0 -and
              $report.facts.physicalConsoleSessionId -ne 4294967295 -and
              $report.facts.physicalConsoleSessionId -eq $report.facts.processSessionId -and
              $report.facts.connectState -eq 0 -and $report.facts.protocolType -eq 0) {
            if (-not $report.facts.lockQuerySucceeded) { throw 'Extended WTS query failed on observable console' }
            Write-Host 'Extended WTS query succeeded on actual observable console'
          }
          # Shape only: CI may have no physical console, so eligible is not asserted true.
          Write-Host "ConsoleProbe result shape OK (eligible=$($report.eligible) reason=$($report.reason))"

      - name: Check ConsoleProbe sampling mode (metadata only)
        shell: pwsh
        run: |
          $out = & "artifacts/console-probe/Helicoid.ConsoleProbe.exe" --watch | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Sampling mode failed' }
          $watch = $out | ConvertFrom-Json
          if ($watch.mode -ne 'lock-watch' -or $watch.sampleCount -ne 31) { throw 'Wrong sampling shape' }
          $total = ($watch.observations | Measure-Object -Property count -Sum).Sum
          if ($total -ne 31 -or $watch.elapsedSeconds -lt 30) { throw 'Sampling ended early' }
          foreach ($segment in $watch.observations) {
            if ($segment.report.schemaVersion -ne 2) { throw 'Wrong nested report schema' }
            if ($segment.report.eligible -and
                ($segment.report.facts.lockState -ne 'Unlocked' -or -not $segment.report.facts.lockQuerySucceeded)) {
              throw 'Sampling accepted a session without explicit unlocked evidence'
            }
          }
          Write-Host "Sampling mode OK: $total observations, $($watch.observations.Count) grouped states"

      - name: Stage ConsoleProbe artifact
        shell: pwsh
        run: |
          Copy-Item "src/Helicoid.ConsoleProbe/README.md" "artifacts/console-probe/README.md" -ErrorAction Stop

      - name: Upload ConsoleProbe diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: helicoid-windows-console-probe
          path: artifacts/console-probe/
          if-no-files-found: error
          retention-days: 14

      # --- WindowsPlatform + CaptureWorker + native integration tests ---

      - name: Build WindowsPlatform
        run: dotnet build src/Helicoid.WindowsPlatform/Helicoid.WindowsPlatform.csproj -c Release --nologo

      - name: Build CaptureWorker
        run: dotnet build src/Helicoid.CaptureWorker/Helicoid.CaptureWorker.csproj -c Release --nologo

      - name: Verify CaptureWorker exists in Computer bundle
        shell: pwsh
        run: |
          $workerPath = "artifacts/computer/CaptureWorker/Helicoid.CaptureWorker.exe"
          if (-not (Test-Path $workerPath)) {
            Write-Error "CaptureWorker.exe not found in Computer bundle at $workerPath"
            exit 1
          }
          Write-Host "CaptureWorker runtime bundle found beside Computer"

      - name: Build Windows-native integration tests
        timeout-minutes: 10
        run: dotnet build src/Helicoid.WindowsIntegrationTests/Helicoid.WindowsIntegrationTests.csproj -c Release --nologo

      - name: Run Windows-native integration tests (real IPC/supervisor paths)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Stage the complete worker runtime bundle in its own directory so
          # its self-contained runtime files do not overwrite test-host files.
          $testBin = (Get-ChildItem -Path "src/Helicoid.WindowsIntegrationTests/bin/Release" -Recurse -Filter "Helicoid.WindowsIntegrationTests.dll" | Select-Object -First 1).DirectoryName
          $workerOut = "src/Helicoid.CaptureWorker/bin/Release/net10.0/win-x64"
          if (-not (Test-Path $workerOut)) { throw "CaptureWorker output dir missing: $workerOut" }
          $workerTestDir = Join-Path $testBin "CaptureWorker"
          New-Item -ItemType Directory -Path $workerTestDir -Force | Out-Null
          Copy-Item (Join-Path $workerOut "*") -Destination $workerTestDir -Recurse -Force
          if (-not (Test-Path (Join-Path $workerTestDir "Helicoid.CaptureWorker.exe"))) {
            throw "CaptureWorker apphost missing from staged runtime bundle"
          }
          Write-Host "Complete self-contained worker bundle staged into $workerTestDir"

          # blame-hang isolates a hung test and dumps it instead of stalling
          # the job. Results and dumps are uploaded unconditionally below.
          dotnet test src/Helicoid.WindowsIntegrationTests/Helicoid.WindowsIntegrationTests.csproj `
            -c Release --nologo --no-build `
            --blame-hang --blame-hang-timeout 5m `
            --results-directory artifacts/test-results/integration `
            --logger "trx;LogFileName=integration.trx" `
            --logger "console;verbosity=normal"

      - name: Upload native test results and dumps (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helicoid-windows-native-test-results
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14
